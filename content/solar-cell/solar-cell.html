<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled Film</title>
<!--
  UNTITLED FILM — one line: from where to where
  A real-time 3D loop (Three.js r160, WebGL2). Silent. No input required.
  FORMAT: the #frame element's data-aspect / data-langs / data-length (set by new_film.sh from the kickoff answers).

  STORY: (one paragraph: where it starts, every step, where it ends, how the loop closes)
  DATA (real): (every source behind a number on screen)
  LOOK: (lighting, exposure, anything stylised and why)
  ILLUSTRATIVE (and labelled so on screen): (every part that is not measured or not public)
  PACING: authored at a comfortable pace, played through a speed profile built from the beats
  (hook/key ×2, normal ×3.5, transit ×8, return ×3), so one loop runs ~N s.
  Keys (optional): Space = pause/resume · R = restart · H = hide/show text.
  URL: ?t=seconds · ?freeze (QA) · ?safe (show the Shorts UI zones) · ?text=0 (no text layers)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Semi+Condensed:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #05070a;
    --ink: #eef1f4;
    --ink-dim: #a7b0ba;
    --accent: #8fd3ff;
    /* the script font of the film's languages (Noto Sans KR / JP / SC …; new_film.sh sets it and the font link above) */
    --face-lang: sans-serif;
    --face: "Barlow", "Helvetica Neue", "Segoe UI", Arial, var(--face-lang), sans-serif;
    --face-sub: "Barlow Semi Condensed", "Barlow", "Helvetica Neue", Arial, var(--face-lang), sans-serif;
    /* the second-language line (the API's `ko` argument; Korean by default) */
    --face-ko: var(--face-lang), "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
  /* the frame: 9:16 (Shorts / Reels / TikTok) unless data-aspect says otherwise. Text is sized in cqmin (1% of the frame's short
     side), so it has the same pixel size in a 1080 × 1920 and a 1920 × 1080 recording */
  #frame {
    --arw: 9; --arh: 16;
    position: relative; width: min(100vw, calc(100vh * var(--arw) / var(--arh))); aspect-ratio: var(--arw) / var(--arh);
    overflow: hidden; background: var(--bg); container-type: size;
  }
  #frame[data-aspect="16x9"] { --arw: 16; --arh: 9; }
  #frame[data-aspect="1x1"]  { --arw: 1;  --arh: 1; }
  #frame[data-aspect="4x5"]  { --arw: 4;  --arh: 5; }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grade {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(135% 95% at 50% 44%, rgba(0,0,0,0) 58%, rgba(0,0,0,.38) 100%);
  }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 1; }
  /* the caption block sits above the bottom fifth and clear of the right edge, where the Shorts player draws its own UI */
  #caption {
    position: absolute; left: 7%; right: 15%; bottom: 21%;
    pointer-events: none; opacity: 0; will-change: opacity, transform;
  }
  #caption::before {             /* soft scrim so the lines stay readable over bright subjects */
    content: ''; position: absolute; z-index: -1; left: -14%; right: -10%; top: -45%; bottom: -60%;
    background: radial-gradient(70% 62% at 34% 62%, rgba(3,5,8,.66), rgba(3,5,8,.34) 55%, rgba(3,5,8,0) 100%);
  }
  #caption .rule { width: 2.6cqmin; min-width: 14px; height: 2px; background: var(--accent); margin-bottom: 1.4cqmin; }
  #cap-main {
    font-family: var(--face); font-weight: 600; text-transform: uppercase;
    font-size: clamp(15px, 3.6cqmin, 60px); line-height: 1.08; letter-spacing: .06em;
    text-wrap: balance; text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  #cap-sub {
    font-family: var(--face-sub); font-weight: 500; text-transform: uppercase;
    font-size: clamp(11px, 1.95cqmin, 32px); line-height: 1.3; letter-spacing: .1em;
    color: var(--ink-dim); margin-top: .7em; text-wrap: balance; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 1px 12px rgba(0,0,0,.6);
  }
  #cap-ko {
    font-family: var(--face-ko); font-weight: 500; font-size: clamp(11px, 1.85cqmin, 30px); line-height: 1.42;
    letter-spacing: .01em; color: #ccd4dc; margin-top: .45em; text-wrap: balance; word-break: keep-all;
    text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 1px 12px rgba(0,0,0,.6);
  }
  #frame.nolabels #caption, #frame.nolabels #hud, #frame.nolabels #tags, #frame.nolabels #callouts,
  #frame.nolabels #leaders, #frame.nolabels #leadlabs, #frame.nolabels #scale { display: none; }
  /* labels pinned to the 3D view: English name, Korean in parentheses, a dot on the object */
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #tags .tag { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  #tags .tag > div { position: absolute; left: 0; bottom: 0; transform: translate(-50%, -12px); white-space: nowrap; text-align: center;
    padding: .3em .6em .34em; background: rgba(6,9,13,.66); border: 1px solid rgba(143,211,255,.45); border-radius: 3px; }
  #tags .tag.below > div { bottom: auto; top: 0; transform: translate(-50%, 12px); }
  #tags .tag b { display: block; font: 600 clamp(8px, 1.42cqmin, 22px)/1.15 var(--face); letter-spacing: .03em; color: #eef3f6; }
  #tags .tag i { display: block; font: 500 clamp(7px, 1.22cqmin, 19px)/1.2 var(--face-ko); font-style: normal; color: #c9d1d9; margin-top: .12em; }
  #tags .tag::before { content: ''; position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px rgba(143,211,255,.9); }
  #tags .tag::after { content: ''; position: absolute; left: -.5px; bottom: 0; width: 1px; height: 12px; background: rgba(143,211,255,.7); }
  #tags .tag.below::after { bottom: auto; top: 0; }
  #tags .tag.hyp > div { border-style: dashed; border-color: rgba(255,210,140,.6); }
  #tags .tag.hyp::before { background: #ffd28c; box-shadow: 0 0 6px rgba(255,210,140,.9); }
  #tags .tag.hyp::after { background: rgba(255,210,140,.7); }
  /* a comparison right after a reveal: the ratio beside the new subject, a short connector to its edge */
  #callouts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .co { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  .co .lab { position: absolute; left: 0; top: 0; white-space: nowrap; padding: .34em .7em .4em; background: rgba(6,9,13,.72);
    border-left: 2px solid var(--accent); transform: translate(-50%, -50%); text-align: left; }
  .co .lab b { display: block; font: 600 clamp(12px, 2.6cqmin, 42px)/1 var(--face); color: #eaf6ff; letter-spacing: .02em; }
  .co .lab span { display: block; font: 500 clamp(8px, 1.35cqmin, 21px)/1.25 var(--face-sub); color: #c6d4de; letter-spacing: .06em; text-transform: uppercase; margin-top: .3em; }
  .co .lab i { display: block; font: 500 clamp(8px, 1.3cqmin, 20px)/1.25 var(--face-ko); font-style: normal; color: #c9d1d9; margin-top: .15em; }
  /* leader labels: a ring on a subject too small to see well, a thin line, and its name */
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #leaders circle { fill: none; stroke: rgba(143,211,255,.95); stroke-width: 1.4; }
  #leaders polyline { fill: none; stroke: rgba(143,211,255,.8); stroke-width: 1.1; }
  #leadlabs { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #leadlabs .ld { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  #leadlabs .ld > div { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; padding: .28em .62em .32em;
    background: rgba(6,9,13,.72); border: 1px solid rgba(143,211,255,.5); border-radius: 3px; transform: translate(-50%, -100%); }
  #leadlabs .ld b { display: block; font: 600 clamp(8px, 1.42cqmin, 22px)/1.15 var(--face); letter-spacing: .03em; color: #eef3f6; }
  #leadlabs .ld i { display: block; font: 500 clamp(7px, 1.22cqmin, 19px)/1.2 var(--face-ko); font-style: normal; color: #c9d1d9; margin-top: .12em; }
  /* field-of-view ruler, top right, below the Shorts player's top bar (its buttons sit lower on the right) */
  #hud { position: absolute; right: 4.5%; top: 11%; height: 27%; width: 30cqmin; pointer-events: none; }
  #hud-title { position: absolute; right: 0; top: -2.9cqmin; font: 500 clamp(8px, 1.3cqmin, 20px)/1 var(--face-sub); letter-spacing: .14em;
    text-transform: uppercase; color: rgba(233,238,242,.5); white-space: nowrap; }
  #hud-title span { font-family: var(--face-ko); letter-spacing: 0; text-transform: none; }
  #hud-line { position: absolute; right: 0; top: 0; bottom: 0; width: 1px; background: rgba(233,238,242,.25); }
  #hud .tick { position: absolute; right: 0; width: .9cqmin; height: 1px; background: rgba(233,238,242,.4); }
  #hud .tick span { position: absolute; right: 1.5cqmin; top: -.62em; font: 500 clamp(7px, 1.25cqmin, 19px)/1 var(--face-sub);
    letter-spacing: .05em; color: rgba(233,238,242,.42); white-space: nowrap; }
  #hud-mark { position: absolute; right: -.5cqmin; width: 2.2cqmin; height: 2px; margin-top: -1px; background: var(--accent);
    box-shadow: 0 0 8px rgba(143,211,255,.7); }
  #hud-val { position: absolute; right: 12.2cqmin; margin-top: -.62em; font: 600 clamp(9px, 1.7cqmin, 26px)/1 var(--face);
    letter-spacing: .04em; color: #cfeaff; white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.85); }
  /* the scale in human terms (optional; the film fills it or leaves it hidden), top left, below the player's top bar */
  #scale { position: absolute; left: 5%; top: 8.5%; width: 58cqmin; pointer-events: none; opacity: 0; padding-left: .9em;
    border-left: 2px solid var(--accent); will-change: opacity; }
  #scale .k { font: 500 clamp(8px, 1.3cqmin, 20px)/1.3 var(--face-sub); letter-spacing: .14em; text-transform: uppercase; color: rgba(233,238,242,.62); }
  #scale .k span { font-family: var(--face-ko); letter-spacing: 0; text-transform: none; }
  #scale .v { font: 600 clamp(15px, 3.3cqmin, 52px)/1.1 var(--face); color: #eaf6ff; margin-top: .22em; letter-spacing: .01em;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(0,0,0,.7); white-space: nowrap; }
  #scale .v small { font: 500 clamp(8px, 1.3cqmin, 20px)/1 var(--face-sub); letter-spacing: .12em; text-transform: uppercase; color: rgba(233,238,242,.62); margin-right: .5em; }
  #scale .v i { font: 500 clamp(9px, 1.5cqmin, 23px)/1 var(--face-ko); font-style: normal; color: #c9d1d9; margin-left: .45em; }
  #scale .r { font: 500 clamp(8px, 1.3cqmin, 20px)/1.35 var(--face-sub); color: #cfe0ec; letter-spacing: .04em; margin-top: .45em; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #scale .r i { display: block; font: 500 clamp(8px, 1.3cqmin, 20px)/1.4 var(--face-ko); font-style: normal; color: #c3ccd5; letter-spacing: 0; }
  #scale .n { font: 500 clamp(8px, 1.25cqmin, 19px)/1.35 var(--face-sub); color: rgba(233,238,242,.62); margin-top: .5em; letter-spacing: .05em; }
  #scale .n i { display: block; font-family: var(--face-ko); font-style: normal; letter-spacing: 0; }
  /* other frames: the same text design, placed clear of that platform's player UI (layout.md; SAFE_ZONES in the core) */
  #frame[data-aspect="16x9"] #caption { left: 5%; right: 45%; bottom: 13%; }
  #frame[data-aspect="16x9"] #hud { right: 3%; top: 12%; height: 42%; }
  #frame[data-aspect="16x9"] #scale { left: 4%; top: 10%; }
  #frame[data-aspect="1x1"] #caption { left: 6%; right: 22%; bottom: 10%; }
  #frame[data-aspect="1x1"] #hud { right: 4%; top: 8%; height: 34%; }
  #frame[data-aspect="1x1"] #scale { left: 5%; top: 6%; }
  #frame[data-aspect="4x5"] #caption { left: 6%; right: 18%; bottom: 11%; }
  #frame[data-aspect="4x5"] #hud { right: 4%; top: 8%; height: 30%; }
  #frame[data-aspect="4x5"] #scale { left: 5%; top: 6%; }
  /* QA only (?safe): where the player draws its own UI over the video (built from SAFE_ZONES) */
  #safe { position: absolute; inset: 0; pointer-events: none; }
  #safe div { position: absolute; background: rgba(255,40,40,.22); outline: 1px dashed rgba(255,90,90,.8); }
  #err {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 0 10%;
    font: 500 15px/1.5 var(--face); color: var(--ink); text-align: center; background: var(--bg);
  }
  #err b { display: block; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: .5em; }
  [hidden] { display: none !important; }
</style>

<body>
<div id="stage">
  <div id="frame" data-aspect="9x16" data-langs="en" data-length="15-20">
    <div id="grade"></div>
    <div id="tags" aria-hidden="true"></div>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="leadlabs" aria-hidden="true"></div>
    <div id="callouts" aria-hidden="true"></div>
    <div id="scale" aria-hidden="true"><div class="k"></div><div class="v"></div><div class="r"></div><div class="n"></div></div>
    <div id="hud" aria-hidden="true"><div id="hud-title">Field of view <span>(화면 폭)</span></div><div id="hud-line"></div><div id="hud-mark"></div><div id="hud-val"></div></div>
    <div id="caption"><div class="rule"></div><div id="cap-main"></div><div id="cap-sub"></div><div id="cap-ko" lang="ko"></div></div>
    <div id="safe" hidden></div>
    <div id="black"></div>
    <div id="err" hidden><div><b>Playback unavailable</b><span id="err-msg"></span></div></div>
  </div>
</div>

<script>
  // Classic (non-module) guard: reports a visible error if the module graph never starts.
  window.__showError = function (msg) {
    var box = document.getElementById('err');
    document.getElementById('err-msg').textContent = msg;
    box.hidden = false;
  };
  window.__bootTimer = setTimeout(function () {
    if (!window.__started) window.__showError('The 3D engine did not load (network or CDN blocked). Reload the page to try again.');
  }, 25000);
  window.addEventListener('error', function (e) {
    if (!window.__started && e && e.message) window.__showError('Startup error: ' + e.message);
  });
</script>

{

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
// (a film may add more imports here, e.g. FontLoader + TextGeometry for 3D lettering, Line2 for fat lines)

/* =====================================================================================
   2. CORE — renderer, floating origin, utilities, and the authoring API the film's timeline calls.
   Pick one world unit for the film (km for space, m for a building, nm for a chip) and use it everywhere.
   ===================================================================================== */
const frameEl = document.getElementById('frame');
// the film's format, chosen at kickoff and written onto #frame by new_film.sh: aspect, caption languages, target loop length (s)
const FORMAT = {
  aspect: frameEl.dataset.aspect || '9x16',
  langs: (frameEl.dataset.langs || 'en ko').trim().split(/\s+/),
  length: (frameEl.dataset.length || '45-60').split('-').map(Number),
};
const ASPECT = (([w, h]) => w / h)(FORMAT.aspect.split('x').map(Number));   // frame width / height
const SHORT = Math.min(ASPECT, 1);             // short side / height: 1 for landscape and square frames
const HFOV = 38;                               // default field of view across the frame's SHORT side (deg) — the width in 9:16
// where each platform's player draws its own UI over the video (fractions of the frame); text and the essential subject stay out.
// side: [x0, y0, y1] — a column of buttons on the right from x0, between heights y0 and y1
const SAFE_ZONES = {
  '9x16': { top: 0.07, bottom: 0.20, side: [0.85, 0.45, 0.80] },   // Shorts / Reels / TikTok: top bar, title + channel, buttons
  '16x9': { top: 0.08, bottom: 0.12, side: null },                 // YouTube: title bar on pause, controls and progress bar
  '1x1':  { top: 0.04, bottom: 0.08, side: null },                 // feed posts: small icons only
  '4x5':  { top: 0.04, bottom: 0.08, side: null },
};
const SAFE = SAFE_ZONES[FORMAT.aspect] || SAFE_ZONES['9x16'];
const canvas = document.createElement('canvas');
frameEl.prepend(canvas);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false, preserveDrawingBuffer: false });
} catch (e) {
  window.__showError('WebGL is not available in this browser or device.');
  throw e;
}
if (!renderer.capabilities.isWebGL2) {
  window.__showError('This piece needs WebGL 2, which this browser does not provide.');
  throw new Error('WebGL2 unavailable');
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = false;
const scene = new THREE.Scene();
scene.background = null;
// floating origin: every object hangs off `universe` in world units; each frame the engine sets
// universe.matrix = S(1/D)·T(−target), so the camera sits one unit from its target at any scale (nm … Gly)
const universe = new THREE.Group();
universe.matrixAutoUpdate = false;
scene.add(universe);
const camera = new THREE.PerspectiveCamera(50, ASPECT, 1e-3, 1e4);
const NEAR = 1e-3, FAR = 1e4;

/* ---------- small utilities (pure functions of time — nothing accumulates between frames) ---------- */
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const range = (t, a, b) => clamp01((t - a) / (b - a));
const smoother = x => x * x * x * (x * (x * 6 - 15) + 10);
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const pulse = (t, a, b, c, d) => smoother(range(t, a, b)) * (1 - smoother(range(t, c, d)));
const lrange = (v, a, b) => clamp01((Math.log10(v) - Math.log10(a)) / (Math.log10(b) - Math.log10(a)));   // log-space ramp
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const deg = Math.PI / 180;
const fmtInt = n => Math.round(n).toLocaleString('en-US');
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const gauss = rnd => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function b64bytes(s) { const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

const NOISE_GLSL = `
  float hash13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float vnoise(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x), mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x), mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm(vec3 p, int oct) { float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++) { if (i >= oct) break; s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;
// anti-aliased line: once a line is thinner than a pixel it fades to its average value (no moiré or shimmer)
const AA_GLSL = `float lineAA(float x, float hw) { float fw = fwidth(x); float f = abs(fract(x) - 0.5);
  float l = 1.0 - smoothstep(hw - fw, hw + fw, f); return mix(l, 2.0 * hw, smoothstep(0.35, 0.9, fw)); }`;

/* ---------- camera orientation: yaw / pitch in named frames ---------- */
// a frame gives the directions yaw/pitch are measured in: yaw 0, pitch 0 puts the eye on +back looking at the target
const CAMFRAMES = { world: { right: V3(1, 0, 0), up: V3(0, 1, 0), back: V3(0, 0, 1) } };
function eyeDir(frame, yaw, pitch) {
  const f = CAMFRAMES[frame], cp = Math.cos(pitch * deg);
  return f.back.clone().multiplyScalar(cp * Math.cos(yaw * deg)).addScaledVector(f.right, cp * Math.sin(yaw * deg)).addScaledVector(f.up, Math.sin(pitch * deg)).normalize();
}
const _lm = new THREE.Matrix4();

        const framed = n > 0 && cx > 0.08 && cx < 0.92 && cy > 0.05 && cy < 1 - SAFE.bottom ? 1 : 0;
        samples.push([+tp.toFixed(3), framed, n ? +Math.max((x1 - x0 + 1) / W, (y1 - y0 + 1) / H).toFixed(3) : 0, +(n / (W * H)).toFixed(4)]);
      }
      return { title: c.en, about: c.about.map(aboutName), declaredOnly: !c.about.length || objs.some(o => !o), samples };
    });
    renderAt(offset);
    return res;
  },

  // is the camera ever inside a subject marked solid() while it is drawn? (every 20 ms of authored time)
  insideCheck() {
    const hits = [];
    for (let tau = 0; tau < LOOP_T; tau += 0.02) {
      placeCamera(tau); TAU_NOW = tau;
      for (const s of SOLIDS) if (s.on(tau) && CAM_POS.distanceTo(s.pos()) < s.r * 1.01) hits.push([+toPlay(tau).toFixed(2), s.name]);
    }
    return { samples: Math.round(LOOP_T / 0.02), solids: SOLIDS.length, hits: hits.length, first: hits.slice(0, 20) };
  },
  // does any subject fade in or out (or switch on / off) while it is in view? (every 20 ms of authored time)
  presenceCheck() {
    const hits = [], W = frameEl.__W, H = frameEl.__H, m = 0.02 * W, prevOn = new Map();
    for (let tau = 0; tau < LOOP_T; tau += 0.02) {
      const busy = SUBJECTS.filter(s => { const on = s.on(tau), was = prevOn.get(s); prevOn.set(s, on);
        if (s.fade) { const a = s.fade(tau); return a > 0.001 && a < 0.999; } return was !== undefined && was !== on; });
      if (!busy.length) continue;
      placeCamera(tau); TAU_NOW = tau;
      for (const s of busy) { const sp = screenOf(s); if (!sp) continue; const rv = sp.r * s.rv / s.r;
        if (sp.x + rv > -m && sp.x - rv < W + m && sp.y + rv > -m && sp.y - rv < H + m) hits.push([+toPlay(tau).toFixed(2), s.name, s.fade ? +s.fade(tau).toFixed(2) : 'switch']); }
    }
    return { subjects: SUBJECTS.length, hits: hits.length, first: hits.slice(0, 20) };
  },
  _dbg: { scene, universe, composer, bloom, mblurPass, flags: {}, CAM, screenOf,
    // for the frame just drawn (QA 'surfaces'): back = share of the frame where the camera looks at the back of a surface that should
    // never be seen from behind (inside a model / a missing face); near = share covered by something closer than 8% of the distance to
    // the target; geo = share covered by opaque geometry at all
    surfaceScan(w = 96) {
      const { buf, w: W, h: H } = scanRender(w, null); let back = 0, near = 0, geo = 0;
      for (let i = 0; i < W * H; i++) { if (buf[i * 4 + 3] < 0.5) continue; geo++; if (buf[i * 4] > 0.5) back++; if (buf[i * 4 + 1] < 0.08) near++; }
      return { back: back / (W * H), near: near / (W * H), geo: geo / (W * H) };
    },
    // which meshes make 'back' in the frame just drawn: each hidden in turn (slow — for fixing, not for scanning).
    // → [[its name (or its parent's, or its geometry type), material type, share %]], largest first
    surfaceWho(w = 96) {
      const base = this.surfaceScan(w).back, out = [], list = [];
      scene.traverse(o => { if (o.isMesh && o.visible) list.push(o); });
      for (const o of list) { o.visible = false; const v = this.surfaceScan(w).back; o.visible = true;
        if (base - v > 0.0005) out.push([o.name || (o.parent && o.parent.name) || o.geometry.type, (Array.isArray(o.material) ? o.material[0] : o.material).type, +((base - v) * 100).toFixed(2)]); }
      return out.sort((a, b) => b[2] - a[2]).slice(0, 8);
    },
    // does the camera pass THROUGH anything? every `dt` of playback, the segment from the last eye to this one against every visible,
    // solid mesh (a surface the camera may cross — a water surface, a cloud layer — says so: userData.passable; see-through glows don't
    // count). Meshes over `maxTris` triangles are left to surfaceScan (listed in skipped). → { hits, first: [[tp, name]], skipped }
    pathScan(dt = 1 / 60, maxTris = 200000) {
      const hits = [], skipped = new Set(), last = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
      let have = false;
      for (let tp = 0; tp <= LOOP; tp += dt) {
        stateAt(Math.min(tp, LOOP - 1e-4));
        if (have) {
          a.copy(last).applyMatrix4(universe.matrixWorld); b.copy(CAM_POS).applyMatrix4(universe.matrixWorld);
          const len = a.distanceTo(b);
          if (len > 1e-9) {
            const list = [];
            scene.traverse(o => {
              if (!o.isMesh || !o.visible) return;
              for (let p = o.parent; p; p = p.parent) if (!p.visible) return;
              const m = Array.isArray(o.material) ? o.material[0] : o.material;
              if (!m || o.userData.passable || (m.userData && m.userData.passable) || (m.transparent && (m.opacity < 0.98 || m.depthWrite === false || m.blending !== THREE.NormalBlending))) return;
              const g = o.geometry, tris = g.index ? g.index.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0);
              if (tris * (o.isInstancedMesh ? o.count : 1) > maxTris) { skipped.add(o.name || (o.parent && o.parent.name) || g.type); return; }
              list.push(o);
            });
            PASS_RC.set(a, b.clone().sub(a).normalize()); PASS_RC.near = 0; PASS_RC.far = len;
            const hit = PASS_RC.intersectObjects(list, false)[0];
            if (hit) hits.push([+tp.toFixed(3), hit.object.name || (hit.object.parent && hit.object.parent.name) || hit.object.geometry.type]);
          }
        }
        last.copy(CAM_POS); have = true;
      }
      renderAt(offset);
      return { hits: hits.length, first: hits.slice(0, 20), skipped: [...skipped].slice(0, 12) };
    },
    nanScan() {                                   // NaN / Inf in the HDR scene render (bloom would spread one into a block)
      const W = Math.round(frameEl.__W * frameEl.__pr), H = Math.round(frameEl.__H * frameEl.__pr);
      const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType });
      renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(scene, camera); renderer.setRenderTarget(null);
      const n = W * H * 4, buf = new Uint16Array(n); renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf); rt.dispose();
      let nan = 0, inf = 0; for (let i = 0; i < n; i++) { const h = buf[i]; if ((h & 0x7c00) === 0x7c00) { if (h & 0x03ff) nan++; else inf++; } }
      return { nan, inf };
    } },
};

/* ---------- warm-up: compile every material and upload buffers before the first frame is shown ---------- */
const BLACK = document.getElementById('black');
function warmup() {
  renderer.compile(scene, camera);
  const taus = typeof WARMUP_TAUS !== 'undefined' ? WARMUP_TAUS : [];
  [...taus.map(tau => WARP.toT(tau)), startT].forEach(tp => renderAt(tp));
}
// fonts: every string the film shows, loaded before the first frame. Google Fonts splits a script into subsets that download only
// when their characters first appear, so without this a caption's first showing flashes in a fallback face (and a recording shows it)
function loadFonts() {
  if (!document.fonts || !document.fonts.load) return null;
  try {
  const panel = [];                                                  // the human-scale panel's lines, sampled over the loop
  if (typeof SCALE_PANEL === 'function') for (let i = 0; i <= 48; i++) { const tau = LOOP_T * i / 48; placeCamera(tau);
    const p = SCALE_PANEL(fieldNow(), tau); if (p) panel.push(p.k, p.v, p.r, p.n); }
  const text = [...panel, ...CAPS.flat(), ...TAGS_DEF.flatMap(d => [d.en, d.ko]), ...LEADER_DEF.flatMap(d => [d.en, d.ko]),
    ...CALLOUTS.flatMap(c => [c.big, c.sub, c.ko]), ...(HAS_RULER ? RULER.ticks.map(k => k[1]) : []), document.getElementById('hud-title').textContent,
    '0123456789 ≈×·.,:%–—()'].filter(x => typeof x === 'string' && x).join(' ');
  const root = getComputedStyle(document.documentElement), lang = root.getPropertyValue('--face-lang').trim();
  const faces = ['600 20px Barlow', '500 20px Barlow', '500 20px "Barlow Semi Condensed"', ...(lang && lang !== 'sans-serif' ? [`500 20px ${lang}`] : [])];
  return Promise.all(faces.map(f => document.fonts.load(f, text).catch(() => null))).then(() => document.fonts.ready);
  } catch (e) { console.warn('font preload skipped: ' + e.message); return null; }
}
// (offline or blocked fonts: start anyway after 8 s, with fallback faces)
Promise.resolve(typeof READY !== 'undefined' ? READY : null).then(() => Promise.race([loadFonts(), new Promise(r => setTimeout(r, 8000))])).then(() => {
  try {
    warmup();
    window.__started = true;
    // the one fade from black, on first start only (the loop itself never goes to black)
    if (params.has('freeze')) BLACK.style.opacity = '0';
    else requestAnimationFrame(() => { BLACK.style.transition = 'opacity 1.2s ease'; BLACK.style.opacity = '0'; });
    clearTimeout(window.__bootTimer);
    base0 = performance.now();
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    window.__showError('Rendering failed to start: ' + (e && e.message ? e.message : e));
  }
}).catch(e => { console.error(e); window.__showError('Loading failed: ' + (e && e.message ? e.message : e)); });
</script>
