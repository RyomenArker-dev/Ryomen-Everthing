<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What Happens If You Fall Into a Black Hole?</title>
<style>
  html,body{margin:0;background:#000;display:grid;place-items:center;height:100vh}
  canvas{width:min(100vw,177.7vh);height:auto}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// RYOMEN 07 / Script 01: "What Actually Happens If You Fall Into a Black Hole?"
// Zero-asset, code-drawn documentary. draw(frame) is a pure function of the frame number.
// TL (timeline) is injected by build.py from timeline.json: scene times, narration lines, word times.
const TL = __TL__;
const W = 1920, H = 1080, FPS = 30, DUR = Math.ceil(TL.duration), FRAMES = FPS * DUR;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
let ctx = cv.getContext('2d');

// LOOK — the brief: dark blue, black and orange; cinematic, clean, scientific.
const NAVY = '#050b1c', DEEP = '#0a1630', ORANGE = '#ff8a2a', AMBER = '#ffb45c', HOT = '#fff1d6', ICE = '#9cc8ff', RED = '#ff4a3a', WHITE = '#f4f6fb';
const FONT = '{w} {s}px Inter, "Inter Display", "Helvetica Neue", Arial, sans-serif';
const F = (w, s) => FONT.replace('{w}', w).replace('{s}', s);

// ---------- math ----------
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => clamp(t) ** 3;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, f = .6) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));   // fade in at a, out at b
function hash2(a, b) { let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- timeline helpers ----------
const SC = TL.scenes, LN = TL.lines;
const AT = SC.map((_, si) => LN.filter(l => l.scene === si).map(l => l.t0));
const A = (si, li) => AT[si][Math.min(li, AT[si].length - 1)];
const sceneAt = t => Math.max(0, SC.findIndex((s, i) => t >= s.from && (t < s.to || i === SC.length - 1)));

// ---------- layout registry (read by layout-check.mjs) ----------
let LAYOUT = [];
function claim(id, kind, x, y, w, h) { const m = ctx.getTransform(), P = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, c]) => [m.a * a + m.c * c + m.e, m.b * a + m.d * c + m.f]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]); LAYOUT.push({ id, kind, x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }); }

// ---------- drawing basics ----------
function glow(x, y, r, rgb, a) { if (a <= 0 || r <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function withCam(cam, fn) { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.k, cam.k); ctx.translate(-cam.x, -cam.y); fn(cam); ctx.restore(); }
function text(s, x, y, o = {}) {
  ctx.save(); ctx.font = F(o.w || 600, o.size || 28); ctx.fillStyle = o.col || WHITE; ctx.globalAlpha = o.a ?? 1; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.spacing) ctx.letterSpacing = o.spacing; if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 14; }
  ctx.fillText(s, x, y); const w = ctx.measureText(s).width; ctx.restore();
  if (o.claim && (o.a ?? 1) > .05) { const x0 = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2; claim(o.claim, 'text', x0, y - (o.size || 28) * .6, w, (o.size || 28) * 1.2); }
  return w;
}
function label(s, x, y, a, o = {}) {   // diagram label: small caps, with a thin orange tick
  if (a <= 0) return; const w = text(s, x, y, { size: o.size || 24, w: 700, col: o.col || AMBER, a, spacing: '2px', align: o.align || 'center', claim: o.id || s });
  return w;
}
function arrow(x0, y0, x1, y1, col, w, a, head = 18) {
  if (a <= 0) return; const an = Math.atan2(y1 - y0, x1 - x0); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(an) * head * .8, y1 - Math.sin(an) * head * .8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(an - .45) * head, y1 - Math.sin(an - .45) * head); ctx.lineTo(x1 - Math.cos(an + .45) * head, y1 - Math.sin(an + .45) * head); ctx.closePath(); ctx.fill(); ctx.restore();
}
function dashedCircle(x, y, r, col, a, w = 3, dash = [14, 12], off = 0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.lineDashOffset = off; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.restore(); }
function fade(a, col = '0,0,0') { if (a <= 0) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(${col},${clamp(a)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }

// ---------- space: nebula + stars (with real lens mapping) ----------
const NEB = document.createElement('canvas'); NEB.width = 480; NEB.height = 270;
(() => { const n = NEB.getContext('2d'), img = n.createImageData(480, 270);
  for (let y = 0; y < 270; y++) for (let x = 0; x < 480; x++) {
    let f = 0, amp = .55, fr = .012; for (let o = 0; o < 5; o++) { f += vnoise(x * fr + 40, y * fr + 7) * amp; amp *= .5; fr *= 2.1; }
    const g = vnoise(x * .02 + 100, y * .02 + 50), i = (y * 480 + x) * 4, m = clamp((f - .38) * 1.9);
    img.data[i] = 5 + m * 20 + g * m * 70; img.data[i + 1] = 11 + m * 30 + g * m * 22; img.data[i + 2] = 28 + m * 70; img.data[i + 3] = 255; }
  n.putImageData(img, 0, 0); })();
const STARS = (() => { const r = rng(21), s = []; for (let i = 0; i < 1500; i++) s.push({ x: (r() - .5) * 3.2 * W, y: (r() - .5) * 3.2 * H, m: Math.pow(r(), 4), ph: r() * TAU, warm: r() < .25 }); return s; })();
function space(t, o = {}) {
  const k = o.k ?? 1, ox = o.x ?? 0, oy = o.y ?? 0, lens = o.lens;
  ctx.fillStyle = NAVY; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = o.neb ?? .9; const nk = 1.25 + (k - 1) * .25; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(NEB, W / 2 - W * nk / 2 - ox * .15, H / 2 - H * nk / 2 - oy * .15, W * nk, H * nk); ctx.restore();
  const al = o.alpha ?? 1;
  for (const s of STARS) {
    let x = W / 2 + (s.x - ox) * k * .6, y = H / 2 + (s.y - oy) * k * .6;
    if (x < -50 || x > W + 50 || y < -50 || y > H + 50) continue;
    const tw = .7 + .3 * Math.sin(t * 1.7 + s.ph), r0 = .6 + s.m * 2.4, col = s.warm ? '255,214,170' : '220,232,255';
    if (!lens) { ctx.globalAlpha = (.35 + .65 * s.m) * tw * al; ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(x, y, r0, 0, TAU); ctx.fill(); continue; }
    // point-lens mapping: a source at distance b gets two images at (b ± sqrt(b²+4E²))/2
    const dx = x - lens.x, dy = y - lens.y, b = Math.hypot(dx, dy) || .01, E = lens.E, u = b / E, s4 = Math.sqrt(b * b + 4 * E * E);
    for (const sign of [1, -1]) {
      const th = (b + sign * s4) / 2, mu = Math.abs((u * u + 2) / (2 * u * Math.sqrt(u * u + 4)) + sign * .5);
      if (Math.abs(th) < lens.R * 1.02) continue;
      const ix = lens.x + dx / b * th, iy = lens.y + dy / b * th, rr = r0 * Math.min(3, Math.sqrt(mu));
      ctx.globalAlpha = clamp((.35 + .65 * s.m) * tw * Math.min(1.6, mu) * al); ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(ix, iy, rr, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- the black hole: shadow, photon ring, accretion disk + its lensed image ----------
const DISK = (() => { const r = rng(9), a = []; for (let i = 0; i < 1700; i++) a.push({ r: 1.6 + Math.pow(r(), 1.5) * 2.8, th: r() * TAU, w: .5 + r() * 1.8, b: .3 + r() * .55, len: .03 + r() * .12 }); return a; })();
function diskCol(r, b) { const h = clamp((4.4 - r) / 2.8); return `rgba(${Math.round(lerp(220, 255, h))},${Math.round(lerp(70, 236, h * h))},${Math.round(lerp(20, 200, h * h * h))},${b})`; }
function blackHole(cx, cy, R, t, o = {}) {
  const tilt = o.tilt ?? .2, al = o.alpha ?? 1, spin = o.spin ?? 1, da = o.diskAlpha ?? 1; if (al <= 0) return;
  const ring = (sy, a0, a1, a, r0 = 1.5, r1 = 4.4) => { if (a * da <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(1, sy); const g = ctx.createRadialGradient(0, 0, R * r0, 0, 0, R * r1);
    g.addColorStop(0, `rgba(255,232,190,${a * da})`); g.addColorStop(.3, `rgba(255,150,50,${a * da * .75})`); g.addColorStop(1, 'rgba(150,40,10,0)'); ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, R * r1, R * r1, 0, a0, a1); ctx.ellipse(0, 0, R * r0, R * r0, 0, a1, a0, true); ctx.closePath(); ctx.fill(); ctx.restore(); };
  ctx.save(); ctx.globalAlpha = al;
  glow(cx, cy, R * 7, '255,120,30', .12); glow(cx, cy, R * 2.6, '255,160,70', .18);
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const pass = (front, image) => {
    for (const p of DISK) {
      const ang = p.th + spin * t * .9 / Math.pow(p.r, 1.5), s = Math.sin(ang), c = Math.cos(ang);
      if (front !== (s > 0)) continue;
      const dop = 1 + .6 * -c, rr = p.r * R;
      let ry = rr * tilt, bb = p.b * dop * .45 * da;
      if (image === 1) { ry = R * (1.08 + (p.r - 1.6) * .42); bb *= .85; }       // far side bent up over the shadow
      if (image === 2) { ry = -R * (1.03 + (p.r - 1.6) * .16); bb *= .32; }      // faint image under the shadow
      ctx.strokeStyle = diskCol(p.r, clamp(bb)); ctx.lineWidth = p.w * R / 120;
      ctx.beginPath(); ctx.ellipse(cx, cy, rr, Math.abs(ry), 0, image === 2 ? -ang - p.len : ang, image === 2 ? -ang : ang + p.len); ctx.stroke();
    }
  };
  if (o.disk !== false) { ring(tilt, Math.PI, TAU, .55); ring(.5, Math.PI, TAU, .4, 2.05, 4.6); ring(.22, 0, Math.PI, .14, 4.6, 6); pass(false, 0); pass(false, 1); pass(false, 2); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();                                      // shadow
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,214,160,.85)'; ctx.lineWidth = Math.max(1.5, R * .03); ctx.shadowColor = 'rgba(255,170,90,.9)'; ctx.shadowBlur = R * .25;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.035, 0, TAU); ctx.stroke(); ctx.shadowBlur = 0;                                // photon ring
  if (o.disk !== false) { ring(tilt, 0, Math.PI, .6); pass(true, 0); }
  ctx.restore();
}

// ---------- props ----------
function ship(x, y, s, rot, t, o = {}) {   // small sleek craft, nose to the right
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha = o.alpha ?? 1;
  const eng = o.engine ?? [255, 170, 80];
  glow(-38, 0, 46, eng.join(','), .55 * (o.thrust ?? 1));
  ctx.fillStyle = o.col || '#c9d3e6';
  ctx.beginPath(); ctx.moveTo(44, 0); ctx.quadraticCurveTo(18, -13, -30, -10); ctx.lineTo(-36, -4); ctx.lineTo(-36, 4); ctx.lineTo(-30, 10); ctx.quadraticCurveTo(18, 13, 44, 0); ctx.fill();
  ctx.fillStyle = o.wing || '#8e9bb4'; ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-26, -26); ctx.lineTo(-30, -9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-26, 26); ctx.lineTo(-30, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(120,200,255,.9)'; ctx.beginPath(); ctx.ellipse(20, -2, 9, 4, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function clock(x, y, r, secs, o = {}) {      // analogue clock; secs = time it shows
  const a = o.alpha ?? 1; if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  ctx.fillStyle = 'rgba(8,16,36,.85)'; ctx.strokeStyle = o.col || AMBER; ctx.lineWidth = r * .07; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.lineCap = 'round'; for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; ctx.lineWidth = r * .04; ctx.beginPath(); ctx.moveTo(Math.cos(an) * r * .8, Math.sin(an) * r * .8); ctx.lineTo(Math.cos(an) * r * .92, Math.sin(an) * r * .92); ctx.stroke(); }
  const sa = secs / 60 * TAU - Math.PI / 2, ma = secs / 3600 * TAU - Math.PI / 2;
  ctx.strokeStyle = WHITE; ctx.lineWidth = r * .07; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ma) * r * .5, Math.sin(ma) * r * .5); ctx.stroke();
  ctx.strokeStyle = o.hand || ORANGE; ctx.lineWidth = r * .035; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(sa) * r * .82, Math.sin(sa) * r * .82); ctx.stroke();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(0, 0, r * .06, 0, TAU); ctx.fill(); ctx.restore();
}
function person(x, y, h, sy = 1, sx = 1, rot = 0, a = 1, col = '#dfe6f3') {   // astronaut silhouette, centred, feet toward +y
  if (a <= 0) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy); ctx.globalAlpha = a; ctx.fillStyle = col; const u = h / 10;
  ctx.beginPath(); ctx.arc(0, -3.9 * u, 1.15 * u, 0, TAU); ctx.fill();                                // helmet
  ctx.beginPath(); ctx.roundRect(-1.2 * u, -2.7 * u, 2.4 * u, 3.6 * u, .9 * u); ctx.fill();          // torso
  ctx.beginPath(); ctx.roundRect(-2 * u, -2.5 * u, .75 * u, 3 * u, .4 * u); ctx.fill(); ctx.beginPath(); ctx.roundRect(1.25 * u, -2.5 * u, .75 * u, 3 * u, .4 * u); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-1.1 * u, .7 * u, .95 * u, 4.2 * u, .45 * u); ctx.fill(); ctx.beginPath(); ctx.roundRect(.15 * u, .7 * u, .95 * u, 4.2 * u, .45 * u); ctx.fill();
  ctx.fillStyle = 'rgba(255,170,90,.85)'; ctx.beginPath(); ctx.ellipse(.35 * u, -3.95 * u, .6 * u, .45 * u, 0, 0, TAU); ctx.fill();  // visor glint
  ctx.restore();
}
function star(x, y, r, t, o = {}) {           // a burning star with a turbulent surface
  const hot = o.col || [190, 215, 255], a = o.alpha ?? 1; if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalAlpha = a;
  glow(x, y, r * 3.2, hot.join(','), .35); glow(x, y, r * 1.6, hot.join(','), .5);
  const g = ctx.createRadialGradient(x - r * .25, y - r * .25, r * .1, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(.6, `rgb(${hot.join(',')})`); g.addColorStop(1, `rgb(${hot.map(v => v * .55 | 0).join(',')})`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) { const an = hash2(i, 3) * TAU, d = Math.sqrt(hash2(i, 4)) * r, s = r * (.06 + hash2(i, 5) * .1) * (.8 + .4 * Math.sin(t * 2 + i));
    ctx.fillStyle = `rgba(255,255,255,${.06 + hash2(i, 6) * .08})`; ctx.beginPath(); ctx.arc(x + Math.cos(an + t * .05) * d, y + Math.sin(an + t * .05) * d, s, 0, TAU); ctx.fill(); }
  ctx.restore(); ctx.restore();
}
function lightRay(path, p, col = HOT, w = 3, a = 1) {    // draws a path progressively with a glowing head
  if (a <= 0 || p <= 0) return; const n = Math.max(2, Math.round(path.length * clamp(p)));
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.beginPath(); path.slice(0, n).forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); ctx.restore();
  const h = path[n - 1]; glow(h[0], h[1], 16, '255,235,200', .8 * a);
}
function bentRay(cx, cy, R, b, x0, x1, E) {   // photon passing a mass: deflected toward it, captured if too close
  const pts = []; for (let x = x0; x <= x1; x += 12) { const def = E * E / b * (1 + x / Math.hypot(x, b)); const y = cy + b - def * Math.sign(b) * .5;
    pts.push([cx + x, y]); if (Math.hypot(x, y - cy) < R * 1.02) break; } return pts;
}

// ---------- overlays: chapter card, concept tags, subtitles ----------
function chapter(si, t) {
  if (si === 0) return; const s = SC[si], a = win(t, s.from + .3, s.from + 5.2, .7); if (a <= 0) return;
  text(String(si + 1).padStart(2, '0'), 80, 86, { size: 26, w: 800, col: ORANGE, a, align: 'left', spacing: '3px', claim: 'chapter-n' });
  text(s.title.toUpperCase(), 130, 86, { size: 26, w: 700, col: WHITE, a, align: 'left', spacing: '3px', claim: 'chapter' });
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ORANGE; ctx.fillRect(80, 108, 60 * easeOut(prog(t, s.from + .3, s.from + 1.2)), 3); ctx.restore();
}
function tag(s, t0, t1, t) {   // concept tag, top right
  const a = win(t, t0, t1, .5); if (a <= 0) return;
  const w = text(s, W - 80, 86, { size: 24, w: 800, col: AMBER, a, align: 'right', spacing: '4px', claim: 'tag' });
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ORANGE; const ww = w * easeOut(prog(t, t0, t0 + .6)); ctx.fillRect(W - 80 - ww, 106, ww, 3); ctx.restore();
}
function subtitles(t) {
  const l = LN.find(x => t >= x.t0 - .15 && t < x.t1 + .55); if (!l) return;
  const a = Math.min(prog(t, l.t0 - .15, l.t0 + .1), 1 - prog(t, l.t1 + .3, l.t1 + .55)); if (a <= 0) return;
  ctx.save(); ctx.font = F(500, 40); ctx.letterSpacing = '0px';
  const sp = ctx.measureText(' ').width, maxW = 1480, rows = [[]]; let rw = 0;
  for (const [wd, ws] of l.wt) { const w = ctx.measureText(wd).width; if (rw + w > maxW && rows[rows.length - 1].length) { rows.push([]); rw = 0; } rows[rows.length - 1].push([wd, ws, w]); rw += w + sp; }
  const lh = 54, bh = rows.length * lh + 26, by = H - 60 - bh, widths = rows.map(r => r.reduce((s, q) => s + q[2], 0) + sp * (r.length - 1)), bw = Math.max(...widths) + 56;
  ctx.globalAlpha = a * .55; ctx.fillStyle = '#02060f'; ctx.beginPath(); ctx.roundRect(W / 2 - bw / 2, by, bw, bh, 14); ctx.fill();
  ctx.textBaseline = 'middle';
  rows.forEach((r, ri) => { let x = W / 2 - widths[ri] / 2; const y = by + 13 + lh * ri + lh / 2;
    for (const [wd, ws, w] of r) { const on = t >= ws - .05, cur = on && LN.indexOf(l) >= 0 && t < ws + .35;
      ctx.globalAlpha = a * (on ? 1 : .42); ctx.fillStyle = cur ? AMBER : WHITE; ctx.fillText(wd, x, y); x += w + sp; } });
  ctx.restore(); claim('subtitle', 'text', W / 2 - bw / 2, by, bw, bh);
}

// ================= SCENES =================
// 1 — The hook: a small ship, a black hole revealed, light bending; then the title card
function s1(t) {
  const s = SC[0], tg = TL.title_gap, p = prog(t, s.from, tg[0]);

    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); const fa = prog(t, a(1), a(1) + 1.5), cx = W / 2, top = 230;
    ctx.save(); ctx.globalAlpha = fa; ctx.strokeStyle = 'rgba(156,200,255,.55)'; ctx.lineWidth = 1.6;
    const depth = r => 520 * Math.pow(1 / (r + .12), .75) - 520 * Math.pow(1 / 1.12, .75);
    for (let i = 0; i < 18; i++) { const r = 1 - i / 18 * .97, y = top + depth(r) * .55, rx = r * 780, ry = r * 120; ctx.beginPath(); ctx.ellipse(cx, y, rx, ry, 0, 0, TAU); ctx.stroke(); }
    for (let j = 0; j < 24; j++) { const an = j / 24 * TAU + t * .03; ctx.beginPath(); for (let i = 0; i <= 40; i++) { const r = 1 - i / 40 * .97, y = top + depth(r) * .55 + Math.sin(an) * r * 120, x = cx + Math.cos(an) * r * 780; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    ctx.restore(); const sy = top + depth(.03) * .55 + 6; glow(cx, sy, 120, '255,150,60', .9 * fa); glow(cx, sy, 30, '255,240,220', fa);
    label('SINGULARITY', cx, sy + 70, win(t, a(1) + 1.2, a(3), .5), { id: 'sing' }); label('INFINITE DENSITY?', cx, 150, win(t, a(2) + .5, a(3), .5), { col: WHITE, size: 30, id: 'inf' });
  } else if (t < a(7)) {                            // two theories that don't fit
    space(t, { k: 1, neb: .5 }); const pa = win(t, a(3), a(7), .6), j = Math.sin(t * 9) * 4 * prog(t, a(4), a(4) + 1), gap = lerp(260, 40, ease(prog(t, a(3) + .3, a(4))));
    const piece = (x, col, s, flip) => { ctx.save(); ctx.translate(x, H / 2 - 40); ctx.globalAlpha = pa; ctx.fillStyle = col; ctx.beginPath(); const w = 420, h = 260, n = flip ? -1 : 1;
      ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, -h / 2); ctx.lineTo(w / 2, -40); ctx.arc(w / 2 + n * 30, 0, 44, -Math.PI / 2 * n * 1, Math.PI / 2 * n * 1, flip); ctx.lineTo(w / 2, h / 2); ctx.lineTo(-w / 2, h / 2); ctx.closePath(); ctx.fill(); ctx.restore();
      text(s, x - (flip ? -10 : 10), H / 2 - 40, { size: 30, w: 800, col: '#0a0f1e', a: pa, shadow: false, claim: s }); };
    piece(W / 2 - 210 - gap / 2 + j, ORANGE, 'RELATIVITY', false); ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); piece(W / 2 - 210 - gap / 2 - j, ICE, '', false); ctx.restore();
    text('QUANTUM', W / 2 + 210 + gap / 2 - j, H / 2 - 40, { size: 30, w: 800, col: '#0a0f1e', a: pa, shadow: false, claim: 'qm' });
    label("THEY DON'T FIT TOGETHER YET", W / 2, 230, win(t, a(4), a(6), .5), { size: 30, col: WHITE, id: 'nofit' });
    label('QUANTUM GRAVITY?', W / 2, 820, win(t, a(6), a(7), .5), { size: 34, id: 'qg' });
    tag('THE CENTRE IS UNKNOWN', a(5) - .2, a(7), t);
  } else {                                          // information falling in
    const k = 1.1; space(t, { k, lens: { x: W / 2, y: H / 2, E: 230 * k, R: 160 * k }, neb: .6 }); withCam({ x: 0, y: 0, k }, () => blackHole(0, 0, 160, t, { tilt: .2 }));
    ctx.save(); ctx.font = F(700, 28); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 60; i++) { const ph = ((t - a(7)) * .18 + hash2(i, 9)) % 1, an = hash2(i, 10) * TAU + ph * 2.5, d = lerp(900, 170, easeIn(ph)) * k;
      ctx.globalAlpha = win(t, a(7), end, .8) * (1 - ph) * .9; ctx.fillStyle = hash2(i, 11) < .5 ? AMBER : ICE; ctx.fillText(hash2(i, 12) < .5 ? '0' : '1', W / 2 + Math.cos(an) * d, H / 2 + Math.sin(an) * d * .6); }
    ctx.restore(); tag('INFORMATION PARADOX', a(8) - .3, end, t);
    label('WHERE DOES THE INFORMATION GO?', W / 2, 170, win(t, a(8) + .5, end, .6), { size: 30, col: WHITE, id: 'info' });
  }
}
// 7 — The ending: pull back past the black hole to billions of galaxies
const GAL = (() => { const r = rng(33), g = []; for (let i = 0; i < 520; i++) g.push({ x: (r() - .5) * 2.6, y: (r() - .5) * 2.6, s: Math.pow(r(), 3) * 26 + 3, a: r() * Math.PI, e: .25 + r() * .6, hue: r() }); return g; })();
function galaxy(x, y, s, an, e, hue, al) { ctx.save(); ctx.translate(x, y); ctx.rotate(an); ctx.scale(1, e); const c = hue < .7 ? '190,210,255' : '255,200,140'; glow(0, 0, s, c, .5 * al); glow(0, 0, s * .3, '255,245,230', .8 * al);
  if (s > 10) { ctx.globalAlpha = al * .5; ctx.strokeStyle = `rgba(${c},.5)`; ctx.lineWidth = s * .08; for (let k = 0; k < 2; k++) { ctx.beginPath(); for (let i = 0; i < 30; i++) { const q = i / 30, a2 = k * Math.PI + q * 4, r = q * s; i ? ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r) : ctx.moveTo(Math.cos(a2) * r, Math.sin(a2) * r); } ctx.stroke(); } }
  ctx.restore(); }
function s7(t) {
  const si = 6, a = i => A(si, i), s = SC[si], p = prog(t, s.from, a(5)), k = lerp(1.4, .25, ease(p));
  space(t, { k: Math.max(.6, k), lens: k > .5 ? { x: W / 2, y: H / 2, E: 200 * k, R: 140 * k } : null, neb: .8 });
  withCam({ x: 0, y: 0, k }, () => blackHole(0, 0, 140, t, { tilt: .2, alpha: 1 - prog(p, .55, .9) }));
  const ga = prog(p, .35, .85); if (ga > 0) for (const g of GAL) galaxy(W / 2 + g.x * W * lerp(2.5, 1, ease(p)), H / 2 + g.y * H * lerp(2.5, 1, ease(p)), g.s * lerp(2, 1, ease(p)), g.a, g.e, g.hue, ga * .9);
  label('BILLIONS OF GALAXIES', W / 2, 170, win(t, a(2), a(4), .6), { size: 30, col: WHITE, id: 'galaxies' });
  const ea = prog(t, a(5) + .3, a(5) + 1.5); if (ea > 0) { fade(ea * .5);
    text('WOULD YOU WATCH ONE', W / 2, H / 2 - 70, { size: 70, w: 800, a: ea, spacing: '4px', claim: 'end1' });
    text('FROM A SAFE DISTANCE?', W / 2, H / 2 + 14, { size: 70, w: 800, col: ORANGE, a: ea, spacing: '4px', claim: 'end2' });
    text('Tell us in the comments', W / 2, H / 2 + 100, { size: 32, w: 500, col: WHITE, a: prog(t, a(7), a(7) + 1), claim: 'end3' }); }
  fade(prog(t, TL.duration - 2.2, TL.duration - .2));
}

const SCENES = [s1, s2, s3, s4, s5, s6, s7];
function draw(frame) {
  const t = frame / FPS; LAYOUT = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.letterSpacing = '0px';
  const si = sceneAt(t); SCENES[si](t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  // vignette + dip to black around each cut
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (si > 0) fade(1 - prog(t, SC[si].from, SC[si].from + .6)); if (si < SC.length - 1) fade(prog(t, SC[si].to - .5, SC[si].to));
  chapter(si, t); subtitles(t);
  window.LAYOUT = LAYOUT;
}
window.draw = draw; window.FRAMES = FRAMES; window.FPS = FPS;
window.CUES = SC.slice(1).map(s => s.from);

// ---------- score: dark ambient, written for this film ----------
// A low drone in D, slow pads that change chord per chapter, filtered "space wind",
// a soft low swell into each chapter (the cut lands on it), and a sparse high shimmer.
window.SCORE = ac => {
  const out = ac.createGain(); out.gain.setValueAtTime(0, 0); out.gain.linearRampToValueAtTime(.85, 3); out.gain.setValueAtTime(.85, DUR - 4); out.gain.linearRampToValueAtTime(0, DUR);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -22; comp.ratio.value = 3; out.connect(comp); comp.connect(ac.destination);
  const dl = ac.createDelay(2); dl.delayTime.value = .9; const fb = ac.createGain(); fb.gain.value = .45; const wet = ac.createGain(); wet.gain.value = .35; dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(out);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const noise = (() => { const b = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate), d = b.getChannelData(0), r = rng(5); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; return b; })();
  // drone
  [38, 45].forEach((m, i) => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m); const g = ac.createGain(); g.gain.value = i ? .05 : .09; o.connect(g); g.connect(out); o.start(0); o.stop(DUR); });
  // space wind
  { const src = ac.createBufferSource(); src.buffer = noise; src.loop = true; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = .7; f.frequency.value = 420;
    const lfo = ac.createOscillator(); lfo.frequency.value = .05; const lg = ac.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(f.frequency); lfo.start(0); lfo.stop(DUR);
    const g = ac.createGain(); g.gain.value = .035; src.connect(f); f.connect(g); g.connect(out); src.start(0); src.stop(DUR); }
  // chapter pads
  const CH = [[50, 57, 62, 65], [46, 53, 58, 62], [48, 55, 60, 63], [43, 50, 55, 58], [41, 48, 53, 57], [44, 51, 56, 60], [50, 57, 62, 69]];
  SC.forEach((s, i) => { const t0 = Math.max(0, s.from - .05), t1 = s.to + 2.5, env = ac.createGain(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = .4;
    env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(.022, t0 + 1.8); env.gain.setValueAtTime(.022, s.to); env.gain.linearRampToValueAtTime(0, t1);
    lp.connect(env); env.connect(out); env.connect(dl);
    CH[i].forEach((m, j) => [-7, 7].forEach(det => { const o = ac.createOscillator(); o.type = j ? 'sawtooth' : 'triangle'; o.frequency.value = mtof(m); o.detune.value = det; const g = ac.createGain(); g.gain.value = j ? .3 : .55; o.connect(g); g.connect(lp); o.start(t0); o.stop(t1 + .1); })); });
  // a soft low swell landing on each chapter cut
  SC.slice(1).forEach(s => { const tt = s.from, o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(70, tt); o.frequency.exponentialRampToValueAtTime(34, tt + 2.2);
    const g = ac.createGain(); g.gain.setValueAtTime(0, tt - .01); g.gain.linearRampToValueAtTime(.32, tt + .02); g.gain.exponentialRampToValueAtTime(.001, tt + 3); o.connect(g); g.connect(out); o.start(tt - .02); o.stop(tt + 3.1);
    const src = ac.createBufferSource(); src.buffer = noise; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(2400, tt); f.frequency.exponentialRampToValueAtTime(200, tt + 1.4);
    const g2 = ac.createGain(); g2.gain.setValueAtTime(0, tt); g2.gain.linearRampToValueAtTime(.12, tt + .02); g2.gain.exponentialRampToValueAtTime(.001, tt + 1.6); src.connect(f); f.connect(g2); g2.connect(out); src.start(tt, .5, 1.7); });
  // sparse high shimmer
  for (let tt = 6; tt < DUR - 6; tt += 7.5) { const m = [74, 77, 81, 79, 76][Math.floor(tt / 7.5) % 5], o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m);
    const g = ac.createGain(); g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(.012, tt + 1.5); g.gain.linearRampToValueAtTime(0, tt + 5); o.connect(g); g.connect(dl); g.connect(out); o.start(tt); o.stop(tt + 5.1); }
};

if (!new URLSearchParams(location.search).has('render')) {
  let start = performance.now();
  const loop = () => { draw(Math.floor((performance.now() - start) / 1000 * FPS) % FRAMES); requestAnimationFrame(loop); }; loop();
  addEventListener('click', () => { const ac = new AudioContext(); window.SCORE(ac); start = performance.now() + 50; }, { once: true });
}
</script>
