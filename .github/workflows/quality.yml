name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workspace checks (secrets, private data, frontmatter, links, structure)
        run: python3 scripts/check_workspace.py
      - name: Unit tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          python3 -m unittest discover -s tests -v
